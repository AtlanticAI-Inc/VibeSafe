name: VibeSafe Comprehensive Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run comprehensive security scan every day at 2 AM
    - cron: '0 2 * * *'

env:
  # Security scan configuration
  SECURITY_SCAN_ENABLED: true
  FAIL_ON_HIGH_SEVERITY: true
  FAIL_ON_CRITICAL_SEVERITY: true

jobs:
  # Job 1: VibeSafe Security Scanning
  vibesafe-scan:
    name: VibeSafe Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install VibeSafe CLI
      run: npm install -g vibesafe@latest
      
    - name: Run VibeSafe Comprehensive Scan
      run: |
        echo "🔍 Running VibeSafe comprehensive security scan..."
        vibesafe scan -o vibesafe-results.json -r vibesafe-report.md || echo "VibeSafe found issues"
        
    - name: Check for Critical/High Issues
      run: |
        if [ -f "vibesafe-results.json" ]; then
          critical_count=$(jq -r '[.secrets[], .dependencies[], .configuration[], .uploads[], .endpoints[], .logging[], .httpClients[] | select(.severity == "Critical")] | length' vibesafe-results.json || echo "0")
          high_count=$(jq -r '[.secrets[], .dependencies[], .configuration[], .uploads[], .endpoints[], .logging[], .httpClients[] | select(.severity == "High")] | length' vibesafe-results.json || echo "0")
          
          echo "Critical issues: $critical_count"
          echo "High issues: $high_count"
          
          if [ "$critical_count" -gt 0 ]; then
            echo "❌ Critical security issues found!"
            exit 1
          elif [ "$high_count" -gt 0 ] && [ "$FAIL_ON_HIGH_SEVERITY" = "true" ]; then
            echo "⚠️ High severity security issues found!"
            exit 1
          fi
        fi
        
    - name: Upload VibeSafe Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vibesafe-security-scan
        path: |
          vibesafe-results.json
          vibesafe-report.md
        retention-days: 30

  # Job 2: Static Application Security Testing (SAST)
  sast-analysis:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    strategy:
      matrix:
        language: ['python', 'javascript', 'typescript']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        
    - name: Upload SAST Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sast-results-${{ matrix.language }}
        path: ${{ runner.workspace }}/results/
        retention-days: 30

  # Job 3: Dependency Security Scan
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - language: python
            files: '["requirements.txt", "pyproject.toml", "poetry.lock"]'
            scanner: safety
          - language: nodejs
            files: '["package.json", "package-lock.json", "yarn.lock"]'
            scanner: npm-audit
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Python dependency scanning
    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python Security Tools
      if: matrix.language == 'python'
      run: |
        pip install safety pip-audit bandit
        
    - name: Python Security Scan
      if: matrix.language == 'python'
      run: |
        echo "🔍 Running Python dependency security scans..."
        safety check --json --output safety-results.json || echo "Safety found vulnerabilities"
        pip-audit --format=json --output=pip-audit-results.json || echo "pip-audit found vulnerabilities"
        bandit -r . -f json -o bandit-results.json || echo "Bandit found issues"
        
    # Node.js dependency scanning
    - name: Setup Node.js
      if: matrix.language == 'nodejs'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      if: matrix.language == 'nodejs'
      run: npm ci || npm install
      
    - name: Node.js Security Scan
      if: matrix.language == 'nodejs'
      run: |
        echo "🔍 Running Node.js dependency security scans..."
        npm audit --audit-level=moderate --json > npm-audit-results.json || echo "npm audit found vulnerabilities"
        npx better-npm-audit --level moderate || echo "better-npm-audit found issues"
        
    - name: Upload Dependency Scan Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-scan-${{ matrix.language }}
        path: |
          *-results.json
        retention-days: 30

  # Job 4: Secrets Scanning
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for comprehensive scan
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install and Run GitLeaks
      run: |
        wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz
        tar -xzf gitleaks_linux_x64.tar.gz
        chmod +x gitleaks
        
        echo "🔍 Running GitLeaks secrets scan..."
        ./gitleaks detect --source . --report-format json --report-path gitleaks-results.json || echo "GitLeaks found potential secrets"
        
    - name: Upload Secrets Scan Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: secrets-scan-results
        path: gitleaks-results.json
        retention-days: 30

  # Job 5: Container Security (if applicable)
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'docker') || contains(github.event.head_commit.message, 'container')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        if [ -f "Dockerfile" ]; then
          docker build -t security-scan:latest .
        else
          echo "No Dockerfile found, skipping container scan"
          exit 0
        fi
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'security-scan:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 6: Security Report Generation  
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [vibesafe-scan, sast-analysis, dependency-scan, secrets-scan]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Report Generator Script
      run: |
        cat << 'PYTHON_SCRIPT' > generate_report.py
        import json
        import os
        from datetime import datetime
        
        def count_issues_in_file(filepath):
            try:
                with open(filepath, 'r') as f:
                    data = json.load(f)
                
                if isinstance(data, list):
                    return len(data)
                elif isinstance(data, dict):
                    if 'issues' in data:
                        return len(data['issues'])
                    elif 'results' in data:
                        return len(data['results'])
                    elif 'vulnerabilities' in data:
                        return len(data['vulnerabilities'])
                    else:
                        return 1 if data else 0
                return 0
            except:
                return 0
        
        # Generate comprehensive security report
        report = {
            'scan_date': datetime.now().isoformat(),
            'repository': os.environ.get('GITHUB_REPOSITORY', 'unknown'),
            'commit': os.environ.get('GITHUB_SHA', 'unknown'),
            'summary': {},
            'details': {}
        }
        
        total_issues = 0
        
        # VibeSafe results
        vibesafe_path = 'vibesafe-security-scan/vibesafe-results.json'
        if os.path.exists(vibesafe_path):
            vibesafe_count = count_issues_in_file(vibesafe_path)
            report['summary']['vibesafe'] = vibesafe_count
            total_issues += vibesafe_count
        
        # Dependency scan results
        for lang in ['python', 'nodejs']:
            for scan_type in ['safety', 'npm-audit', 'pip-audit']:
                path = f'dependency-scan-{lang}/{scan_type}-results.json'
                if os.path.exists(path):
                    count = count_issues_in_file(path)
                    report['summary'][f'{lang}_{scan_type}'] = count
                    total_issues += count
        
        # Secrets scan results
        gitleaks_path = 'secrets-scan-results/gitleaks-results.json'
        if os.path.exists(gitleaks_path):
            count = count_issues_in_file(gitleaks_path)
            report['summary']['secrets_gitleaks'] = count
            total_issues += count
        
        report['summary']['total_issues'] = total_issues
        
        # Determine risk level
        if total_issues == 0:
            risk_level = "LOW"
        elif total_issues <= 5:
            risk_level = "MEDIUM"
        elif total_issues <= 15:
            risk_level = "HIGH"
        else:
            risk_level = "CRITICAL"
        
        report['summary']['risk_level'] = risk_level
        
        # Save comprehensive report
        with open('security-summary-report.json', 'w') as f:
            json.dump(report, f, indent=2)
        
        # Generate markdown report  
        repo_name = report['repository']
        scan_date = report['scan_date']
        commit_short = report['commit'][:8]
        
        markdown_lines = [
            "# 🛡️ VibeSafe Security Scan Summary",
            "",
            "## Overview",
            f"- **Repository**: {repo_name}",
            f"- **Scan Date**: {scan_date}",
            f"- **Commit**: {commit_short}",
            f"- **Risk Level**: {risk_level}",
            f"- **Total Issues**: {total_issues}",
            "",
            "## Scan Results",
            "",
            "| Tool | Issues Found |",
            "|------|-------------|"
        ]
        
        for key, value in report['summary'].items():
            if key not in ['total_issues', 'risk_level']:
                markdown_lines.append(f"| {key} | {value} |")
        
        markdown_lines.extend([
            "",
            "## Risk Assessment",
            "",
            f"**Risk Level: {risk_level}**",
            ""
        ])
        
        if risk_level == "CRITICAL":
            markdown_lines.extend([
                "🔴 **CRITICAL RISK** - Immediate action required",
                "- Multiple high-severity security issues detected",
                "- Security team review mandatory before deployment",
                "- Consider emergency response procedures"
            ])
        elif risk_level == "HIGH":
            markdown_lines.extend([
                "🟠 **HIGH RISK** - Action required within 24 hours",
                "- Significant security issues detected",
                "- Security review recommended before deployment"
            ])
        elif risk_level == "MEDIUM":
            markdown_lines.extend([
                "🟡 **MEDIUM RISK** - Address within 1 week",
                "- Some security issues detected",
                "- Regular security review recommended"
            ])
        else:
            markdown_lines.extend([
                "🟢 **LOW RISK** - No immediate action required",
                "- No significant security issues detected",
                "- Continue regular security monitoring"
            ])
        
        markdown_content = '\n'.join(markdown_lines)
        
        with open('security-summary-report.md', 'w') as f:
            f.write(markdown_content)
        
        print(f"Generated security report with {total_issues} total issues, risk level: {risk_level}")
        PYTHON_SCRIPT
        
    - name: Generate Security Summary Report
      run: python3 generate_report.py
        
    - name: Upload Security Summary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-summary-report
        path: |
          security-summary-report.json
          security-summary-report.md
        retention-days: 90
        
    - name: Comment PR with Security Summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          try {
            if (fs.existsSync('security-summary-report.md')) {
              const report = fs.readFileSync('security-summary-report.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🛡️ VibeSafe Comprehensive Security Scan Results\n\n${report}`
              });
            }
          } catch (error) {
            console.log('Could not post security summary:', error.message);
          }
          
    - name: Fail on Critical Issues
      run: |
        if [ -f "security-summary-report.json" ]; then
          risk_level=$(jq -r '.summary.risk_level' security-summary-report.json)
          
          if [ "$risk_level" = "CRITICAL" ]; then
            echo "❌ Critical security issues found! Failing the build."
            exit 1
          elif [ "$risk_level" = "HIGH" ] && [ "$FAIL_ON_HIGH_SEVERITY" = "true" ]; then
            echo "⚠️ High severity security issues found! Failing the build."
            exit 1
          fi
        fi
