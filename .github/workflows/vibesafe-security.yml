---
name: VibeSafe CLI Security Scanning

on:
  push:
    branches: [main, develop, team/security-framework-private]
  pull_request:
    branches: [main, team/security-framework-private]
  workflow_dispatch:

env:
  FAIL_ON_HIGH_SEVERITY: false  # Set to false for testing, change to true for production

jobs:
  # Job 1: VibeSafe CLI Security Scan
  vibesafe-security-scan:
    name: VibeSafe CLI Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install VibeSafe CLI
        run: |
          echo "🔧 Installing VibeSafe CLI..."
          npm install -g vibesafe@latest
          echo "✅ VibeSafe CLI installed successfully"

      - name: Verify VibeSafe CLI Installation
        run: |
          echo "🔍 Verifying VibeSafe CLI installation..."
          vibesafe --version
          echo "VibeSafe CLI help:"
          vibesafe --help
          echo "VibeSafe scan help:"
          vibesafe scan --help

      - name: Run VibeSafe Comprehensive Security Scan
        run: |
          echo "🛡️ Running VibeSafe comprehensive security scan..."
          echo "Scanning directory: $(pwd)"
          echo "Files to be scanned:"
          find . -name "*.js" -o -name "*.ts" -o -name "*.json" | head -20
          
          # Run VibeSafe scan with both JSON and markdown reports
          vibesafe scan \
            --output vibesafe-results.json \
            --report vibesafe-report.md \
            .
          
          echo "✅ VibeSafe scan completed"

      - name: Display VibeSafe Scan Results
        run: |
          echo "=== VIBESAFE SCAN SUMMARY ==="
          
          if [ -f "vibesafe-results.json" ]; then
            echo "📊 VibeSafe Results Summary:"
            echo "Results file size: $(wc -c < vibesafe-results.json) bytes"
            
            # Parse and display summary using Node.js
            node << 'EOF'
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('vibesafe-results.json', 'utf8'));
              
              console.log('\n🔍 VibeSafe Security Analysis Results:');
              console.log('=====================================');
              
              let totalIssues = 0;
              
              // Count issues by category
              const categories = [
                { name: 'Secrets', key: 'secrets', icon: '🔐' },
                { name: 'Dependencies', key: 'dependencies', icon: '📦' },
                { name: 'Configuration', key: 'configuration', icon: '⚙️' },
                { name: 'File Uploads', key: 'uploads', icon: '📁' },
                { name: 'API Endpoints', key: 'endpoints', icon: '🌐' },
                { name: 'Rate Limiting', key: 'rateLimiting', icon: '🚦' },
                { name: 'Logging', key: 'logging', icon: '📝' },
                { name: 'HTTP Clients', key: 'httpClients', icon: '🌍' },
                { name: 'Information', key: 'info', icon: 'ℹ️' },
                { name: 'Gitignore Warnings', key: 'gitignoreWarnings', icon: '⚠️' }
              ];
              
              categories.forEach(category => {
                const issues = results[category.key] || [];
                const count = issues.length;
                totalIssues += count;
                
                console.log(`${category.icon} ${category.name}: ${count} ${count === 1 ? 'issue' : 'issues'}`);
                
                // Show first few issues for each category
                if (count > 0) {
                  issues.slice(0, 3).forEach((issue, index) => {
                    if (issue.message) {
                      console.log(`   ${index + 1}. ${issue.message}`);
                    } else if (issue.type && issue.message) {
                      console.log(`   ${index + 1}. [${issue.type}] ${issue.message}`);
                    } else {
                      console.log(`   ${index + 1}. ${JSON.stringify(issue).substring(0, 100)}...`);
                    }
                  });
                  if (count > 3) {
                    console.log(`   ... and ${count - 3} more`);
                  }
                }
              });
              
              console.log('\n📊 Summary:');
              console.log(`Total Issues Found: ${totalIssues}`);
              
              if (totalIssues === 0) {
                console.log('🎉 No security issues detected!');
              } else if (totalIssues <= 5) {
                console.log('⚠️ Some security issues detected - review recommended');
              } else {
                console.log('🚨 Multiple security issues detected - immediate attention needed');
              }
              
            } catch (error) {
              console.error('Error parsing VibeSafe results:', error.message);
              console.log('Raw results file content:');
              console.log(fs.readFileSync('vibesafe-results.json', 'utf8'));
            }
            EOF
          else
            echo "❌ No VibeSafe results file found"
          fi

      - name: Check High Severity Issues
        run: |
          if [ -f "vibesafe-results.json" ]; then
            echo "🔍 Checking for high severity issues..."
            
            # Use Node.js to check for high severity issues
            HIGH_SEVERITY_COUNT=$(node << 'EOF'
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('vibesafe-results.json', 'utf8'));
              let highSeverityCount = 0;
              
              // Check each category for high severity issues
              Object.keys(results).forEach(category => {
                if (Array.isArray(results[category])) {
                  results[category].forEach(issue => {
                    if (issue.severity && (issue.severity === 'High' || issue.severity === 'Critical')) {
                      highSeverityCount++;
                    }
                  });
                }
              });
              
              console.log(highSeverityCount);
            } catch (error) {
              console.log(0);
            }
            EOF
            )
            
            echo "High/Critical severity issues found: $HIGH_SEVERITY_COUNT"
            
            if [ "$HIGH_SEVERITY_COUNT" -gt 0 ] && [ "$FAIL_ON_HIGH_SEVERITY" = "true" ]; then
              echo "🚨 High/Critical severity issues detected and FAIL_ON_HIGH_SEVERITY is enabled!"
              echo "Set FAIL_ON_HIGH_SEVERITY=false to allow the workflow to continue with warnings."
              exit 1
            elif [ "$HIGH_SEVERITY_COUNT" -gt 0 ]; then
              echo "⚠️ High/Critical severity issues detected but workflow will continue (FAIL_ON_HIGH_SEVERITY=false)"
            else
              echo "✅ No high/critical severity issues detected"
            fi
          fi

      - name: Upload VibeSafe Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibesafe-scan-results
          path: |
            vibesafe-results.json
            vibesafe-report.md
          retention-days: 30

      - name: Display VibeSafe Markdown Report
        if: always()
        run: |
          if [ -f "vibesafe-report.md" ]; then
            echo "📄 VibeSafe Markdown Report:"
            echo "=========================="
            cat vibesafe-report.md
          else
            echo "⚠️ VibeSafe markdown report not generated"
          fi

  # Job 2: Supplementary Security Tools (to complement VibeSafe)
  supplementary-security:
    name: Supplementary Security Tools
    runs-on: ubuntu-latest
    needs: vibesafe-security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for audit
        run: |
          if [ -f "package.json" ]; then
            echo "📦 Installing dependencies for npm audit..."
            npm ci || npm install
          else
            echo "⚠️ No package.json found, skipping dependency installation"
          fi

      - name: Run npm audit (complement to VibeSafe dependency scanning)
        run: |
          echo "🔍 Running npm audit to complement VibeSafe dependency analysis..."
          if [ -f "package.json" ]; then
            npm audit --json > npm-audit-supplement.json 2>&1 || echo "npm audit completed with findings"
            echo "✅ npm audit completed as supplement to VibeSafe"
          else
            echo "⚠️ No package.json found, skipping npm audit"
            echo "{}" > npm-audit-supplement.json
          fi

      - name: Run GitLeaks (complement to VibeSafe secrets detection)
        run: |
          echo "🔍 Running GitLeaks to complement VibeSafe secrets detection..."
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz
          tar -xzf gitleaks_linux_x64.tar.gz
          chmod +x gitleaks
          
          ./gitleaks detect --source . --report-format json --report-path gitleaks-supplement.json || echo "GitLeaks completed"
          echo "✅ GitLeaks completed as supplement to VibeSafe"

      - name: Upload supplementary results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplementary-security-results
          path: |
            npm-audit-supplement.json
            gitleaks-supplement.json
          retention-days: 30

  # Job 3: Security Report Consolidation
  security-consolidation:
    name: Security Analysis Consolidation
    runs-on: ubuntu-latest
    needs: [vibesafe-security-scan, supplementary-security]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate VibeSafe-Focused Security Report
        run: |
          echo "📊 Generating VibeSafe-focused comprehensive security report..."
          
          cat > vibesafe-security-summary.md << 'EOF'
          # 🛡️ VibeSafe CLI Security Analysis Report
          
          ## Overview
          - **Repository**: ${{ github.repository }}
          - **Scan Date**: $(date -u)
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Primary Tool**: VibeSafe CLI
          
          ## Primary Analysis: VibeSafe CLI Results
          
          EOF
          
          # Add VibeSafe results analysis
          if [ -f "vibesafe-scan-results/vibesafe-results.json" ]; then
            echo "### 🎯 VibeSafe CLI Findings" >> vibesafe-security-summary.md
            
            # Use Node.js to create a summary
            node << 'SCRIPT_EOF'
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('vibesafe-scan-results/vibesafe-results.json', 'utf8'));
              
              let totalIssues = 0;
              const categories = [
                'secrets', 'dependencies', 'configuration', 'uploads', 
                'endpoints', 'rateLimiting', 'logging', 'httpClients', 
                'info', 'gitignoreWarnings'
              ];
              
              categories.forEach(category => {
                const issues = results[category] || [];
                totalIssues += issues.length;
              });
              
              let summary = `\n**VibeSafe CLI detected ${totalIssues} total findings across all categories.**\n\n`;
              
              if (totalIssues === 0) {
                summary += '🎉 **Excellent!** VibeSafe found no security issues.\n';
              } else {
                summary += `📋 **Categories with findings:**\n`;
                categories.forEach(category => {
                  const issues = results[category] || [];
                  if (issues.length > 0) {
                    summary += `- ${category}: ${issues.length} ${issues.length === 1 ? 'issue' : 'issues'}\n`;
                  }
                });
              }
              
              fs.appendFileSync('vibesafe-security-summary.md', summary);
            } catch (error) {
              fs.appendFileSync('vibesafe-security-summary.md', '\n❌ Error processing VibeSafe results.\n');
            }
            SCRIPT_EOF
          else
            echo "❌ VibeSafe results not available" >> vibesafe-security-summary.md
          fi
          
          # Add supplementary analysis note
          echo "" >> vibesafe-security-summary.md
          echo "## Supplementary Analysis" >> vibesafe-security-summary.md
          echo "Additional tools (npm audit, GitLeaks) were run to provide comprehensive coverage alongside VibeSafe CLI." >> vibesafe-security-summary.md
          echo "" >> vibesafe-security-summary.md
          echo "## Recommendations" >> vibesafe-security-summary.md
          echo "1. **Primary Focus**: Address all VibeSafe CLI findings as they are specifically designed for comprehensive security analysis" >> vibesafe-security-summary.md
          echo "2. **Regular Scanning**: Run VibeSafe CLI regularly as part of development workflow" >> vibesafe-security-summary.md
          echo "3. **CI/CD Integration**: Keep this VibeSafe CLI workflow enabled for all pull requests" >> vibesafe-security-summary.md
          
          echo "✅ VibeSafe-focused security report generated"

      - name: Display VibeSafe Security Summary
        run: |
          echo "=== VIBESAFE CLI COMPREHENSIVE SECURITY SUMMARY ==="
          if [ -f "vibesafe-security-summary.md" ]; then
            cat vibesafe-security-summary.md
          fi

      - name: Upload VibeSafe-focused security summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibesafe-security-summary
          path: |
            vibesafe-security-summary.md
          retention-days: 90
