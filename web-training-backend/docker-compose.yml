version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vibesafe-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: vibesafe-training
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - vibesafe-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibesafe-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/vibesafe-training?authSource=admin
      JWT_SECRET: your-super-secure-jwt-secret-for-production
      JWT_REFRESH_SECRET: your-super-secure-refresh-secret-for-production
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
    networks:
      - vibesafe-network

volumes:
  mongodb_data:

networks:
  vibesafe-network:
    driver: bridge
